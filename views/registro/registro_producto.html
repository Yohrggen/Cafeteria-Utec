 <section>
    <h1>Registro</h1>
 </section>
 <section id="registro">
    <form action="" method="post">
      <label for="nombre_cliente">Ingrese su Nombre(s) y Apellidos: </label>
      <input type="text" id="nombre_cliente" name="nombre_cliente"><br>
      <label for="producto">Ingrese el producto solicitado: </label>
      <input type="text" id="producto" name="producto"><br>
      <label for="cantidad">Ingrese a la cantidad del producto: </label>
      <input type="number" id="cantidad" name="cantidad"><br>
      <label for="tipo_producto">Seleccione la prioridad de su pedido: </label>
      <select name="tipo_producto" id="tipo_producto">
         <option value="" selected hidden>Seleccione una opción</option>
         <option value="prioritario">Prioritario</option>
         <option value="comun">Comun</option>
      </select><br>

      <br><button submit>Enviar</button>
      <button type="reset">Borrar</button>
   </form>
 </section>
